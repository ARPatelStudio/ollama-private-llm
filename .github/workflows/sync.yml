name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 🚀 FIX: Username ki jagah 'user' likha hai, taaki HF isey password auth na samjhe
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/favouritegamer/ollama-private-llm"
          git push --force space main
