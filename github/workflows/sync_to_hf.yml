name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Jab bhi 'main' branch par push hoga, yeh trigger hoga
  workflow_dispatch: # Manual trigger ka option

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://favouritegamer:$HF_TOKEN@huggingface.co/spaces/favouritegamer/ollama-private-llm
          git push --force space main
